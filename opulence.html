<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Classifieds</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Flutterwave Checkout SDK for payment handling -->
    <script src="https://checkout.flutterwave.com/v3.js"></script> 
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease-in-out; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1E40AF',
                        'secondary-gray': '#F3F4F6',
                        'whatsapp-green': '#25D366',
                        'flutterwave-purple': '#9D50E5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-secondary-gray min-h-screen p-4 sm:p-8">

    <div id="app" class="max-w-xl mx-auto">
        <!-- Header & Authentication Status -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-primary-blue mb-2">Nigerian Classifieds</h1>
            <p class="text-lg text-gray-600 mb-4">Post and browse products in Naira (₦)</p>

            <!-- Authentication Controls and Status -->
            <div id="auth-controls" class="bg-white p-3 rounded-xl shadow-lg border border-gray-100 flex justify-between items-center flex-wrap gap-2">
                <span id="auth-status" class="font-medium text-gray-600">Initializing...</span>
                <div id="auth-buttons">
                    <!-- Buttons will be rendered here by JS based on login state -->
                </div>
            </div>
        </header>

        <!-- Product Creation Card (Visible only when logged in) -->
        <div id="post-product-card" class="bg-white p-6 rounded-xl shadow-2xl mb-8 border border-gray-100 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Post a Product for Sale</h2>

            <label for="product-name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
            <input type="text" id="product-name" placeholder="E.g., Samsung S21 Used"
                   class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">

            <label for="product-description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="product-description" rows="3" placeholder="Condition, location, and key features..."
                      class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150"></textarea>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="product-price" class="block text-sm font-medium text-gray-700 mb-1">Price (₦)</label>
                    <input type="number" id="product-price" placeholder="50000" min="0"
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
                </div>
                <div>
                    <label for="contact-number" class="block text-sm font-medium text-gray-700 mb-1">WhatsApp Number</label>
                    <input type="tel" id="contact-number" placeholder="2348012345678"
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
                </div>
            </div>

            <!-- Save Button -->
            <button id="save-post-btn"
                    class="w-full bg-primary-blue text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition duration-300 transform active:scale-95"
                    onclick="savePost()">
                <span id="button-text">Post Product</span>
                <span id="loading-spinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full ml-2"></span>
            </button>

            <!-- Feedback message area -->
            <p id="feedback-message" class="mt-4 text-center font-medium h-6"></p>
        </div>
        
        <!-- Monetization Section -->
        <div class="bg-yellow-100 p-6 rounded-xl shadow-lg mb-8 border border-yellow-300">
            <h2 class="text-xl font-bold text-yellow-800 mb-2 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5m-9 0h9" />
                </svg>
                Promote Your Listing (Monetization)
            </h2>
            <p class="text-yellow-700 text-sm mb-4">
                Simulated integration with Flutterwave using **₦500** for promotion.
            </p>
            <button onclick="handleMonetizationPayment()"
                    class="w-full bg-flutterwave-purple text-white font-bold py-2 rounded-lg shadow-md hover:bg-purple-700 transition duration-150 transform active:scale-95">
                Pay ₦500 to Feature (Flutterwave)
            </button>
        </div>

        <!-- Posts Display Section (Visible to everyone) -->
        <div class="mb-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">All Listings from Sellers</h2>
            <div id="posts-container" class="space-y-4">
                <p id="initial-loading" class="text-center text-gray-500">Authenticating and loading products...</p>
                <!-- Products will be injected here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Authentication Modal (Register/Login) -->
    <div id="auth-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center opacity-0 pointer-events-none z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-11/12 transform transition duration-300 scale-95 relative">
            <h3 id="auth-modal-title" class="text-2xl font-bold text-primary-blue mb-4">Login</h3>
            
            <label for="auth-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="auth-email" placeholder="you@example.com"
                   class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">

            <label for="auth-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="auth-password" placeholder="Min 6 characters"
                   class="w-full p-3 mb-6 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
            
            <button id="auth-submit-btn"
                    class="w-full bg-primary-blue text-white font-bold py-3 px-4 rounded-lg shadow-md hover:bg-blue-700 transition duration-150 transform active:scale-95 mb-3"
                    onclick="handleAuthSubmit()">Submit</button>
            
            <p id="auth-modal-error" class="text-red-500 text-center text-sm h-5 mb-3"></p>
            
            <button id="auth-toggle-btn"
                    class="w-full text-sm text-primary-blue hover:text-blue-700"
                    onclick="toggleAuthMode()">Need an account? Register</button>

            <button onclick="closeAuthModal()"
                    class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
    </div>

    <!-- The old Monetization Modal is removed as Flutterwave handles the payment UI -->

    <!-- Firebase SDKs and Application Logic -->
    <script type="module">
        // ----------------------------------------------------------------
        // 1. FIREBASE IMPORTS AND CONFIG
        // ----------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInAnonymously, onAuthStateChanged, signOut, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword, 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, orderBy, 
            serverTimestamp, setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration provided by the user
        const firebaseConfig = {
          apiKey: "AIzaSyDMqAYibN8d598SknpPXhOsCgjLx0OSmgE",
          authDomain: "love-hub-a1c51.firebaseapp.com",
          projectId: "love-hub-a1c51",
          storageBucket: "love-hub-a1c51.firebasestorage.app",
          messagingSenderId: "978736762123",
          appId: "1:978736762123:web:a6490b768528b0634a260e"
        };
        
        // FLUTTERWAVE PUBLIC KEY
        const FLUTTERWAVE_PUBLIC_KEY = "FLWPUBK-b144c0c07294bbc6f4b3ac884960f766-X";

        // Environment variables
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const canvasAppId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.projectId;
        const appId = canvasAppId; 

        let app, db, auth, userId = null;
        let authMode = 'login'; // 'login' or 'register'

        // DOM elements
        const authStatusElement = document.getElementById('auth-status');
        const authButtonsDiv = document.getElementById('auth-buttons');
        const postsContainer = document.getElementById('posts-container');
        const loadingElement = document.getElementById('initial-loading');
        const postProductCard = document.getElementById('post-product-card');

        // ----------------------------------------------------------------
        // 2. MODAL & FEEDBACK HANDLERS
        // ----------------------------------------------------------------

        function getAuthModalElements() {
             return {
                modal: document.getElementById('auth-modal'),
                title: document.getElementById('auth-modal-title'),
                email: document.getElementById('auth-email'),
                password: document.getElementById('auth-password'),
                error: document.getElementById('auth-modal-error'),
                submit: document.getElementById('auth-submit-btn'),
                toggle: document.getElementById('auth-toggle-btn')
             }
        }

        window.showAuthModal = function(mode) {
            authMode = mode;
            const elements = getAuthModalElements();
            elements.modal.classList.remove('opacity-0', 'pointer-events-none');
            elements.modal.querySelector('div').classList.remove('scale-95');
            
            if (mode === 'register') {
                elements.title.textContent = 'Register';
                elements.submit.textContent = 'Sign Up';
                elements.toggle.textContent = 'Already have an account? Login';
            } else {
                elements.title.textContent = 'Login';
                elements.submit.textContent = 'Sign In';
                elements.toggle.textContent = 'Need an account? Register';
            }
            elements.error.textContent = '';
            elements.email.value = '';
            elements.password.value = '';
        }

        window.closeAuthModal = function() {
            const modal = document.getElementById('auth-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
        }

        window.toggleAuthMode = function() {
            showAuthModal(authMode === 'login' ? 'register' : 'login');
        }

        function displayFeedback(message, type = 'success') {
            const feedbackEl = document.getElementById('feedback-message');
            feedbackEl.textContent = message;
            feedbackEl.className = 'mt-4 text-center font-medium h-6 transition-colors duration-300';
            
            if (type === 'success') {
                feedbackEl.classList.add('text-green-600');
            } else if (type === 'error') {
                feedbackEl.classList.add('text-red-600');
            } else { // info/monetization
                 feedbackEl.classList.add('text-blue-600');
            }

            setTimeout(() => { feedbackEl.textContent = ''; feedbackEl.className = 'mt-4 text-center font-medium h-6'; }, 5000);
        }

        // ----------------------------------------------------------------
        // 3. AUTHENTICATION LOGIC (Login, Register, Logout)
        // ----------------------------------------------------------------

        window.handleAuthSubmit = async function() {
            const elements = getAuthModalElements();
            const email = elements.email.value.trim();
            const password = elements.password.value.trim();
            
            elements.error.textContent = '';
            elements.submit.disabled = true;

            if (!email || password.length < 6) {
                elements.error.textContent = 'Email required and password must be 6+ chars.';
                elements.submit.disabled = false;
                return;
            }

            try {
                if (authMode === 'register') {
                    await createUserWithEmailAndPassword(auth, email, password);
                    displayFeedback('Registration successful! You are now logged in.', 'success');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    displayFeedback('Login successful!', 'success');
                }
                closeAuthModal();
            } catch (error) {
                console.error("Auth Error:", error);
                const msg = error.message.replace(/Firebase: /g, '').replace(/\(auth.*\)/g, '').trim();
                elements.error.textContent = msg;
            } finally {
                elements.submit.disabled = false;
            }
        }

        window.logout = async function() {
            try {
                await signOut(auth);
                displayFeedback('Logged out successfully.', 'info');
            } catch (error) {
                console.error("Logout Error:", error);
                displayFeedback('Failed to log out.', 'error');
            }
        }

        // ----------------------------------------------------------------
        // 4. FLUTTERWAVE MONETIZATION PAYMENT
        // ----------------------------------------------------------------
        window.handleMonetizationPayment = function() {
            if (!auth.currentUser || !auth.currentUser.email) {
                displayFeedback('You must be logged in with an email/password account to promote a product.', 'error');
                showAuthModal('login');
                return;
            }
            
            // This transaction is a simulation of the payment initiation process.
            // The actual payment would open a secure Flutterwave window/modal.
            
            FlutterwaveCheckout({
                public_key: FLUTTERWAVE_PUBLIC_KEY,
                tx_ref: "NC_" + Date.now() + "_" + auth.currentUser.uid.substring(0, 8),
                amount: 500, // Fixed amount for featuring the listing
                currency: "NGN", // Naira is specified
                payment_options: "card,mobilemoney,ussd",
                customer: {
                    email: auth.currentUser.email,
                    phone_number: '08000000000', // Mock phone number
                    name: auth.currentUser.email,
                },
                customizations: {
                    title: "Classifieds Product Promotion",
                    description: "24-hour product featuring service for ₦500",
                    logo: "https://placehold.co/60x60/9D50E5/ffffff?text=NG",
                },
                callback: function (data) {
                    // This function is called after the transaction is completed (or failed)
                    if (data.status === 'successful') {
                        // In a real app, you would now update the product in Firestore 
                        // to mark it as 'featured' for 24 hours.
                        displayFeedback('Payment successful (Simulated)! Your product is now featured.', 'success');
                    } else {
                        displayFeedback('Payment failed or was cancelled.', 'error');
                    }
                },
                onclose: function() {
                    console.log('Payment modal closed by user.');
                }
            });
        };


        // ----------------------------------------------------------------
        // 5. INITIALIZATION & STATE LISTENER
        // ----------------------------------------------------------------
        async function initializeAppAndAuth() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('debug');

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        const isEmailUser = user.email !== null; 

                        if (isEmailUser) {
                            authStatusElement.innerHTML = `Logged in as: <span class="font-semibold text-primary-blue">${user.email}</span>`;
                            renderAuthButtons(true);
                            postProductCard.classList.remove('hidden');
                        } else {
                            // Initial sign-in via token or anonymous user who can only read public data
                             authStatusElement.innerHTML = `Signed in as <span class="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">${userId}</span> (Read Only)`;
                             renderAuthButtons(false);
                        }
                        
                    } else {
                        userId = null;
                        authStatusElement.textContent = `Welcome! Please Register or Login to post products.`;
                        renderAuthButtons(false);
                        postProductCard.classList.add('hidden');
                        
                        // Sign in anonymously so unregistered users can still see public products
                        signInAnonymously(auth).catch(e => console.error("Anonymous sign-in failed:", e));
                    }
                    setupRealtimeListener();
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                authStatusElement.textContent = `Error: Initialization failed.`;
            }
        }
        
        function renderAuthButtons(isLoggedIn) {
            authButtonsDiv.innerHTML = '';
            if (isLoggedIn) {
                authButtonsDiv.innerHTML = `
                    <button onclick="logout()" class="bg-red-500 text-white font-bold py-1 px-3 rounded-lg shadow-md hover:bg-red-600 transition duration-150 transform active:scale-95 text-sm">
                        Logout
                    </button>
                `;
            } else {
                authButtonsDiv.innerHTML = `
                    <button onclick="showAuthModal('login')" class="bg-primary-blue text-white font-bold py-1 px-3 rounded-lg shadow-md hover:bg-blue-700 transition duration-150 transform active:scale-95 text-sm mr-2">
                        Login
                    </button>
                    <button onclick="showAuthModal('register')" class="bg-gray-200 text-gray-800 font-bold py-1 px-3 rounded-lg shadow-md hover:bg-gray-300 transition duration-150 transform active:scale-95 text-sm">
                        Register
                    </button>
                `;
            }
        }

        // ----------------------------------------------------------------
        // 6. REALTIME DATA LISTENER (Public Path)
        // ----------------------------------------------------------------
        function setupRealtimeListener() {
            if (!db) return;

            // Public Path: /artifacts/{appId}/public/data/listings
            const publicCollectionPath = `artifacts/${appId}/public/data/listings`;
            const q = query(collection(db, publicCollectionPath), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (loadingElement) loadingElement.remove();

                const posts = [];
                snapshot.forEach((doc) => {
                    posts.push({ id: doc.id, ...doc.data() });
                });

                renderPosts(posts);
            }, (error) => {
                console.error("Error listening to public listings (Check Rules):", error);
                postsContainer.innerHTML = `<p class="text-red-500">Error loading public listings: ${error.message}. You must update your Firestore security rules!</p>`;
            });
        }
        
        // --- Helper Functions for Formatting ---
        
        function formatNaira(amount) {
            const number = Number(amount);
            if (isNaN(number)) return amount;
            return '₦' + number.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }
        
        function getWhatsAppLink(phoneNumber) {
            let cleanNumber = phoneNumber.replace(/\D/g, '');
            if (cleanNumber.length >= 10 && !cleanNumber.startsWith('234')) {
                if (cleanNumber.startsWith('0')) {
                    cleanNumber = '234' + cleanNumber.substring(1);
                } else {
                    cleanNumber = '234' + cleanNumber;
                }
            }
            return `https://wa.me/${cleanNumber}`;
        }

        // ----------------------------------------------------------------
        // 7. RENDERING PRODUCTS
        // ----------------------------------------------------------------
        function renderPosts(posts) {
            if (posts.length === 0) {
                postsContainer.innerHTML = '<p class="text-gray-500 text-center py-4">No products posted yet. Register and be the first!</p>';
                return;
            }

            postsContainer.innerHTML = posts.map(post => {
                const date = post.createdAt?.toDate ? post.createdAt.toDate().toLocaleString() : 'Saving...';
                const whatsappLink = getWhatsAppLink(post.contactNumber || '');
                const formattedPrice = formatNaira(post.price);

                return `
                    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
                        <div class="flex justify-between items-start mb-2 flex-wrap gap-2">
                            <h3 class="text-2xl font-bold text-gray-800">${post.name || 'Untitled Product'}</h3>
                            <span class="text-xl font-extrabold text-green-600 bg-green-50 px-3 py-1 rounded-full whitespace-nowrap">${formattedPrice}</span>
                        </div>
                        <p class="text-gray-700 whitespace-pre-wrap mb-4">${post.description || 'No description provided.'}</p>
                        
                        <!-- WhatsApp Contact Button -->
                        <a href="${whatsappLink}" target="_blank" 
                           class="inline-flex items-center justify-center w-full bg-whatsapp-green text-white font-bold py-2 px-4 rounded-lg shadow-md hover:bg-green-700 transition duration-150 transform active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="mr-2">
                                <path d="M12.001 2c-5.523 0-10 4.477-10 10s4.477 10 10 10c1.87 0 3.61-.519 5.122-1.428l2.946.965-1.026-2.883c1.04-1.57 1.621-3.398 1.621-5.654 0-5.523-4.477-10-10-10zm0 18c-4.418 0-8-3.582-8-8s3.582-8 8-8 8 3.582 8 8-3.582 8-8 8zm4.722-5.462c-.259-.129-1.554-.766-1.795-.853-.24-.087-.416-.13-.591.13-.176.26-.679.853-.833 1.029-.155.176-.309.196-.57.065-.26-.13-1.096-.404-2.087-1.296-.771-.705-1.289-1.576-1.444-1.836-.155-.26-.016-.399.114-.528.117-.116.259-.304.388-.456.129-.155.173-.259.259-.434.087-.176.043-.329-.016-.459-.059-.13-.591-1.417-.811-1.936-.217-.518-.435-.447-.591-.447-.142 0-.309-.016-.476-.016-.168 0-.435.059-.668.329-.233.26-.884.853-.884 2.088 0 1.233.905 2.41 1.034 2.585.129.176 1.77 2.709 4.305 3.799 2.532 1.09 2.532.726 2.992.684.46-.043 1.488-.606 1.7-.853.217-.25.217-.476.158-.592z"/>
                            </svg>
                            Contact Seller via WhatsApp
                        </a>
                        
                        <p class="text-xs text-gray-500 mt-2">Posted: ${date}</p>
                    </div>
                `;
            }).join('');
        }

        // ----------------------------------------------------------------
        // 8. SAVE FUNCTION (Uses Public Path)
        // ----------------------------------------------------------------
        window.savePost = async function() {
            if (!auth.currentUser || !auth.currentUser.email) {
                displayFeedback('You must be logged in with an email/password account to post a product.', 'error');
                showAuthModal('login');
                return;
            }

            const nameInput = document.getElementById('product-name');
            const descriptionInput = document.getElementById('product-description');
            const priceInput = document.getElementById('product-price');
            const numberInput = document.getElementById('contact-number');
            const saveBtn = document.getElementById('save-post-btn');
            const btnText = document.getElementById('button-text');
            const spinner = document.getElementById('loading-spinner');

            const name = nameInput.value.trim();
            const description = descriptionInput.value.trim();
            const price = priceInput.value.trim();
            const contactNumber = numberInput.value.trim();

            if (!name || !description || !price || !contactNumber) {
                displayFeedback('All fields are required.', 'error');
                return;
            }

            saveBtn.disabled = true;
            btnText.textContent = 'Posting...';
            spinner.classList.remove('hidden');

            try {
                // Public Path: /artifacts/{appId}/public/data/listings
                const postsRef = collection(db, `artifacts/${appId}/public/data/listings`);
                
                await addDoc(postsRef, {
                    name: name,
                    description: description,
                    price: price,
                    contactNumber: contactNumber,
                    posterId: auth.currentUser.uid,
                    posterEmail: auth.currentUser.email,
                    createdAt: serverTimestamp()
                });

                displayFeedback('Product posted successfully!');
                
                nameInput.value = '';
                descriptionInput.value = '';
                priceInput.value = '';
                numberInput.value = '';

            } catch (e) {
                console.error("Error adding document (Check Public Rules): ", e);
                displayFeedback(`Error posting: ${e.code || e.message}. Check your Firestore rules for public access!`, 'error');
            } finally {
                saveBtn.disabled = false;
                btnText.textContent = 'Post Product';
                spinner.classList.add('hidden');
            }
        };

        // Start the entire application flow on load
        initializeAppAndAuth();
    </script>
</body>
</html>
