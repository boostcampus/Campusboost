<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Campus Boost</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f2f5;
    }
    .navbar-brand { font-weight: 700; color: #0d6efd; }
    .dashboard-card {
      border-radius: 12px; border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .dashboard-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.1);
    }
    .stat-card { text-align: center; padding: 1.5rem; }
    .stat-value { font-size: 2.5rem; font-weight: 600; }
    .login-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .login-container {
      background: #fff; padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%; max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-container">
      <h3 class="mb-3 text-center">Campus Boost Admin Login</h3>
      <form id="admin-login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" value="admin@campusboost.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div id="error-message" class="text-danger mt-3" style="display: none;"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardContent" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary" href="#">🔧 Campus Boost Admin</a>
        <div class="navbar-nav ms-auto">
          <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-4">
      <!-- STATS -->
      <div class="row mb-4">
        <div class="col-md-3 mb-3">
          <div class="card dashboard-card stat-card">
            <div class="stat-value" id="totalUsers">0</div>
            <div class="text-muted">Total Users</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="card dashboard-card stat-card">
            <div class="stat-value text-success" id="premiumUsers">0</div>
            <div class="text-muted">Premium Users</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="card dashboard-card stat-card">
            <div class="stat-value text-warning" id="trialUsers">0</div>
            <div class="text-muted">Trial Users</div>
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <div class="card dashboard-card stat-card">
            <div class="stat-value text-primary" id="totalEarnings">₦0</div>
            <div class="text-muted">Est. Earnings</div>
          </div>
        </div>
      </div>

      <!-- USERS -->
      <div class="card dashboard-card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">👥 User Management</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Premium Expiry</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div class="card dashboard-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">🛍️ Marketplace Products</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Product</th><th>Seller</th><th>Price</th><th>Status</th><th>Promotion</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, doc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAEFnSKxmuxZ3JKHacGn3iMzps6yuwCS0E",
      authDomain: "campus-boost-7d7ac.firebaseapp.com",
      projectId: "campus-boost-7d7ac",
      storageBucket: "campus-boost-7d7ac.firebasestorage.app",
      messagingSenderId: "755100429989",
      appId: "1:755100429989:web:d6abbff0dd0f5b24abe74c",
      measurementId: "G-333LVQX0KZ"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginOverlay = document.getElementById('loginOverlay');
    const dashboardContent = document.getElementById('dashboardContent');

    // Check authentication
    onAuthStateChanged(auth, (user) => {
      if (user && user.email === 'admin@campusboost.com') {
        loginOverlay.style.display = 'none';
        dashboardContent.classList.remove('d-none');
        liveDashboard();
      } else {
        loginOverlay.style.display = 'flex';
        dashboardContent.classList.add('d-none');
        if (user) signOut(auth);
      }
    });

    // Admin Login
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        if (userCredential.user.email === 'admin@campusboost.com') {
          loginOverlay.style.display = 'none';
          dashboardContent.classList.remove('d-none');
          liveDashboard();
        } else {
          await signOut(auth);
          errorMessage.textContent = 'Invalid admin email.';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = 'Invalid email or password.';
        errorMessage.style.display = 'block';
      }
    });

    // Live Dashboard Function
    function liveDashboard() {
      liveUsers();
      liveProducts();
    }

    // LIVE USERS LISTENER
    function liveUsers() {
      const usersRef = collection(db, 'users');
      onSnapshot(usersRef, (snapshot) => {
        let totalUsers = 0, premiumUsers = 0, trialUsers = 0, totalEarnings = 0;
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        snapshot.forEach((docSnap) => {
          const user = docSnap.data();
          totalUsers++;
          const premiumExpiry = user.premiumExpiry?.toDate();
          const isPremium = premiumExpiry && premiumExpiry > new Date();
          const statusText = isPremium ? (user.isTrialUser ? 'Trial' : 'Premium') : 'Free';
          const statusClass = isPremium ? (user.isTrialUser ? 'warning' : 'success') : 'secondary';
          if (isPremium) {
            if (user.isTrialUser) trialUsers++;
            else { premiumUsers++; totalEarnings += 500; }
          }

          tbody.innerHTML += `
            <tr>
              <td>${user.fullName || 'N/A'}</td>
              <td>${user.email || 'N/A'}</td>
              <td>${user.phone || 'N/A'}</td>
              <td><span class="badge bg-${statusClass}">${statusText}</span></td>
              <td>${premiumExpiry ? premiumExpiry.toLocaleDateString() : 'N/A'}</td>
              <td><button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${docSnap.id}')">Delete</button></td>
            </tr>`;
        });

        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('premiumUsers').textContent = premiumUsers;
        document.getElementById('trialUsers').textContent = trialUsers;
        document.getElementById('totalEarnings').textContent = `₦${totalEarnings.toLocaleString()}`;
      });
    }

    // LIVE PRODUCTS LISTENER
    function liveProducts() {
      const productsRef = collection(db, 'products');
      onSnapshot(productsRef, (snapshot) => {
        const tbody = document.getElementById('productsTableBody');
        tbody.innerHTML = '';

        snapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const productStatusClass = product.status === 'Active' ? 'success' : 'danger';
          const promotionStatusClass = product.promotion ? 'warning' : 'secondary';

          tbody.innerHTML += `
            <tr>
              <td>${product.name || 'N/A'}</td>
              <td>${product.seller || 'N/A'}</td>
              <td>₦${product.price ? product.price.toLocaleString() : '0'}</td>
              <td><span class="badge bg-${productStatusClass}">${product.status || 'N/A'}</span></td>
              <td><span class="badge bg-${promotionStatusClass}">${product.promotion ? 'Promoted' : 'None'}</span></td>
              <td><button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${docSnap.id}')">Delete</button></td>
            </tr>`;
        });
      });
    }

    // DELETE FUNCTIONS
    window.deleteUser = async function(userId) {
      if (confirm('Are you sure you want to delete this user?')) {
        await deleteDoc(doc(db, 'users', userId));
        alert('User deleted successfully');
      }
    };

    window.deleteProduct = async function(productId) {
      if (confirm('Are you sure you want to delete this product?')) {
        await deleteDoc(doc(db, 'products', productId));
        alert('Product deleted successfully');
      }
    };

    // LOGOUT
    window.logout = async function() {
      await signOut(auth);
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
